<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phoenix 03 — Personal Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Departure+Mono&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0c0c;
      --surface:   #141414;
      --raised:    #1a1a1a;
      --border:    #222;
      --muted:     #333;
      --text:      #e8e8e0;
      --subtext:   #666;
      --accent:    #c8ff00;
      --accent2:   #ff6b35;
      --mono:      'Departure Mono', monospace;
      --serif:     'Fraunces', serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── grain overlay ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
    }

    .shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: 100vh;
      height: 100vh;
    }

    /* ── sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 500;
      font-style: italic;
      color: var(--accent);
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .logo-sub {
      font-size: 0.65rem;
      color: var(--subtext);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .status-panel {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .status-label {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 10px;
    }

    .agent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .agent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--subtext);
    }

    .agent-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .agent-dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .agent-dot.error  { background: var(--accent2); }

    .agent-name { color: var(--text); }

    .quick-actions {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .quick-label {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 10px;
    }

    .quick-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 7px 10px;
      border-radius: 3px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 6px;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(200,255,0,0.04);
    }

    .quick-btn:last-child { margin-bottom: 0; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      font-size: 0.62rem;
      color: var(--subtext);
    }

    .session-id {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.58rem;
    }

    /* ── main ── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── topbar ── */
    .topbar {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--bg);
    }

    .topbar-title {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--subtext);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .img-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 5px 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }

    .img-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--subtext);
      font-family: var(--mono);
      font-size: 0.68rem;
      cursor: pointer;
      letter-spacing: 0.5px;
      padding: 5px 0;
    }

    .clear-btn:hover { color: var(--text); }

    /* ── messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    /* ── empty state ── */
    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 400px;
    }

    .empty-glyph {
      font-family: var(--serif);
      font-style: italic;
      font-size: 4rem;
      color: var(--border);
      line-height: 1;
      margin-bottom: 20px;
    }

    .empty-title {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.1rem;
      color: var(--subtext);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-size: 0.7rem;
      color: var(--muted);
      line-height: 1.8;
    }

    /* ── message bubbles ── */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadeUp 0.3s ease forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.62rem;
      color: var(--subtext);
    }

    .msg-role {
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .msg-role.user      { color: var(--accent); }
    .msg-role.assistant { color: var(--accent2); }

    .msg-time { color: var(--muted); }

    .msg-agent {
      font-size: 0.58rem;
      background: var(--raised);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 2px;
      color: var(--subtext);
      letter-spacing: 0.5px;
    }

    .msg-body {
      font-size: 0.82rem;
      line-height: 1.75;
      color: var(--text);
      max-width: 680px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .msg-body {
      color: var(--subtext);
      font-size: 0.78rem;
    }

    /* tool calls */
    .msg-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .tool-tag {
      font-size: 0.6rem;
      background: rgba(200,255,0,0.06);
      border: 1px solid rgba(200,255,0,0.15);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    /* error */
    .msg-error {
      font-size: 0.72rem;
      color: var(--accent2);
      background: rgba(255,107,53,0.06);
      border: 1px solid rgba(255,107,53,0.2);
      padding: 8px 12px;
      border-radius: 4px;
      margin-top: 4px;
    }

    /* image preview */
    .img-preview {
      max-width: 280px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    /* ── thinking indicator ── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      color: var(--subtext);
      animation: fadeUp 0.2s ease forwards;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }

    .thinking-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s ease infinite;
    }

    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1); }
    }

    /* ── input area ── */
    .input-area {
      padding: 16px 28px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }

    /* image attach preview */
    #img-attach-preview {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--subtext);
    }

    #img-attach-preview.visible { display: flex; }

    .attach-thumb {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    .attach-name { flex: 1; color: var(--text); }

    .attach-remove {
      background: none;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 4px;
    }

    .attach-remove:hover { color: var(--accent2); }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.82rem;
      padding: 12px 14px;
      border-radius: 4px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 160px;
      line-height: 1.6;
      transition: border-color 0.15s;
    }

    textarea::placeholder { color: var(--muted); }
    textarea:focus { border-color: var(--muted); }

    .send-btn {
      background: var(--accent);
      border: none;
      color: var(--bg);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      height: 44px;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .send-btn:hover   { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .input-hint {
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* ── hidden file input ── */
    #file-input { display: none; }

    /* responsive */
    @media (max-width: 768px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">Phoenix</div>
      <div class="logo-sub">Personal OS · 03</div>
    </div>

    <div class="status-panel">
      <div class="status-label">Agents</div>
      <div class="agent-list" id="agent-list">
        <div class="agent-item">
          <div class="agent-dot"></div>
          <span>Loading...</span>
        </div>
      </div>
    </div>

    <div class="quick-actions">
      <div class="quick-label">Quick Actions</div>
      <button class="quick-btn" onclick="sendQuick('morning briefing')">↑ Morning briefing</button>
      <button class="quick-btn" onclick="sendQuick('what\'s on my calendar today?')">⊞ Today\'s calendar</button>
      <button class="quick-btn" onclick="sendQuick('check my unread Slack messages')">◈ Unread messages</button>
      <button class="quick-btn" onclick="sendQuick('what\'s playing on Spotify?')">▷ Now playing</button>
    </div>

    <div class="sidebar-footer">
      <div>Session active</div>
      <div class="session-id" id="session-display"></div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- topbar -->
    <div class="topbar">
      <div class="topbar-title">What can I help with?</div>
      <div class="topbar-right">
        <button class="img-btn" onclick="document.getElementById('file-input').click()">
          ⊕ Attach image
        </button>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
      </div>
    </div>

    <!-- messages -->
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-glyph">φ</div>
        <div class="empty-title">Ready when you are.</div>
        <div class="empty-sub">
          Ask anything — check your calendar, read Slack,<br/>
          play music, analyze a photo, or get a morning briefing.
        </div>
      </div>
    </div>

    <!-- input -->
    <div class="input-area">
      <div id="img-attach-preview">
        <img class="attach-thumb" id="attach-thumb" src="" alt=""/>
        <span class="attach-name" id="attach-name"></span>
        <button class="attach-remove" onclick="removeAttachment()">✕</button>
      </div>
      <div class="input-row">
        <textarea
          id="input"
          placeholder="Ask Phoenix anything..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="send-btn" onclick="send()">Send</button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line · Attach images for vision analysis</div>
    </div>

    <!-- hidden file input -->
    <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)"/>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const SESSION_ID   = 'session_' + Math.random().toString(36).slice(2, 8);
let   attachedFile = null;
let   isThinking   = false;

document.getElementById('session-display').textContent = SESSION_ID;

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    renderAgents(data.active_agents || []);
  } catch (e) {
    renderAgents([]);
  }
})();

function renderAgents(agents) {
  const known = ['messaging', 'calendar', 'media', 'vision', 'briefing', 'orchestrator'];
  const list  = document.getElementById('agent-list');
  list.innerHTML = known.map(a => {
    const active = agents.includes(a);
    return `<div class="agent-item">
      <div class="agent-dot ${active ? 'active' : ''}"></div>
      <span class="${active ? 'agent-name' : ''}">${a}</span>
    </div>`;
  }).join('');
}

// ── Messaging ─────────────────────────────────────────────────────────────────
function addMessage(role, content, meta = {}) {
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();

  const now    = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  const msgEl  = document.createElement('div');
  msgEl.className = `msg ${role}`;

  let metaHtml = `
    <div class="msg-meta">
      <span class="msg-role ${role}">${role === 'user' ? 'YOU' : 'PHOENIX'}</span>
      <span class="msg-time">${now}</span>
      ${meta.agent ? `<span class="msg-agent">${meta.agent}</span>` : ''}
    </div>`;

  let bodyHtml = `<div class="msg-body">${escHtml(content)}</div>`;

  let toolsHtml = '';
  if (meta.tools && meta.tools.length) {
    toolsHtml = `<div class="msg-tools">
      ${meta.tools.map(t => `<span class="tool-tag">⚙ ${t}</span>`).join('')}
    </div>`;
  }

  let errorHtml = '';
  if (meta.errors && meta.errors.length) {
    errorHtml = `<div class="msg-error">⚠ ${meta.errors.join(' · ')}</div>`;
  }

  let imgHtml = '';
  if (meta.imageUrl) {
    imgHtml = `<img class="img-preview" src="${meta.imageUrl}" alt="Attached image"/>`;
  }

  msgEl.innerHTML = metaHtml + imgHtml + bodyHtml + toolsHtml + errorHtml;

  document.getElementById('messages').appendChild(msgEl);
  scrollBottom();
}

function addThinking() {
  const el = document.createElement('div');
  el.className = 'thinking';
  el.id        = 'thinking';
  el.innerHTML = `
    <div class="thinking-dots">
      <span></span><span></span><span></span>
    </div>
    <span>Phoenix is working...</span>`;
  document.getElementById('messages').appendChild(el);
  scrollBottom();
}

function removeThinking() {
  const el = document.getElementById('thinking');
  if (el) el.remove();
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function send() {
  const input   = document.getElementById('input');
  const message = input.value.trim();
  if (!message && !attachedFile) return;
  if (isThinking) return;

  isThinking = true;
  document.getElementById('send-btn').disabled = true;

  const imageUrl = attachedFile ? URL.createObjectURL(attachedFile) : null;
  addMessage('user', message || '(image)', { imageUrl });

  input.value = '';
  autoResize(input);
  addThinking();

  try {
    let result;

    if (attachedFile) {
      // Vision endpoint
      const form = new FormData();
      form.append('image',      attachedFile);
      form.append('message',    message || 'What do you see in this image?');
      form.append('session_id', SESSION_ID);

      const resp = await fetch('/api/vision', { method: 'POST', body: form });
      result = await resp.json();
    } else {
      // Chat endpoint
      const resp = await fetch('/api/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ message, session_id: SESSION_ID }),
      });
      result = await resp.json();
    }

    removeThinking();
    removeAttachment();

    addMessage('assistant', result.response || result.error || 'No response.', {
      agent:  result.agent_used,
      tools:  result.tools_used || [],
      errors: result.errors || [],
    });

  } catch (err) {
    removeThinking();
    addMessage('assistant', `Connection error: ${err.message}`, { errors: [err.message] });
  }

  isThinking = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

function sendQuick(msg) {
  document.getElementById('input').value = msg;
  send();
}

// ── Image handling ────────────────────────────────────────────────────────────
function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;

  attachedFile = file;

  const preview  = document.getElementById('img-attach-preview');
  const thumb    = document.getElementById('attach-thumb');
  const nameEl   = document.getElementById('attach-name');

  thumb.src      = URL.createObjectURL(file);
  nameEl.textContent = file.name;
  preview.classList.add('visible');

  // Reset file input so same file can be re-selected
  e.target.value = '';
}

function removeAttachment() {
  attachedFile = null;
  document.getElementById('img-attach-preview').classList.remove('visible');
  document.getElementById('attach-thumb').src = '';
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function clearChat() {
  fetch('/api/reset', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ session_id: SESSION_ID }),
  });
  const m = document.getElementById('messages');
  m.innerHTML = `<div class="empty-state" id="empty-state">
    <div class="empty-glyph">φ</div>
    <div class="empty-title">Ready when you are.</div>
    <div class="empty-sub">Ask anything — check your calendar, read Slack,<br/>play music, analyze a photo, or get a morning briefing.</div>
  </div>`;
}

function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}
</script>
</body>
</html>
